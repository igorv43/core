syntax = "proto3";
package terra.oracle.v1beta1;

import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/classic-terra/core/v4/x/oracle/types";

// Params defines the parameters for the oracle module.
message Params {
  option (gogoproto.equal)            = true;
  option (gogoproto.goproto_stringer) = false;

  uint64 vote_period    = 1 [(gogoproto.moretags) = "yaml:\"vote_period\""];
  string vote_threshold = 2 [
    (cosmos_proto.scalar)  = "cosmos.Dec",
    (gogoproto.moretags)   = "yaml:\"vote_threshold\"",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable)   = false
  ];
  string reward_band = 3 [
    (cosmos_proto.scalar)  = "cosmos.Dec",
    (gogoproto.moretags)   = "yaml:\"reward_band\"",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable)   = false
  ];
  uint64         reward_distribution_window = 4 [(gogoproto.moretags) = "yaml:\"reward_distribution_window\""];
  repeated Denom whitelist                  = 5 [
    (gogoproto.moretags)     = "yaml:\"whitelist\"",
    (gogoproto.castrepeated) = "DenomList",
    (gogoproto.nullable)     = false
  ];
  string slash_fraction = 6 [
    (cosmos_proto.scalar)  = "cosmos.Dec",
    (gogoproto.moretags)   = "yaml:\"slash_fraction\"",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable)   = false
  ];
  uint64 slash_window         = 7 [(gogoproto.moretags) = "yaml:\"slash_window\""];
  string min_valid_per_window = 8 [
    (cosmos_proto.scalar)  = "cosmos.Dec",
    (gogoproto.moretags)   = "yaml:\"min_valid_per_window\"",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable)   = false
  ];
  // asset_whitelist lists the assets priced in USD by the same ballot
  // (Liquidity Fabric spec §21.6 stage 2). Names must not collide with the
  // denom whitelist; an asset vote is "USD per unit of the asset", not
  // "LUNC in the asset".
  repeated Asset asset_whitelist = 9 [
    (gogoproto.moretags)     = "yaml:\"asset_whitelist\"",
    (gogoproto.castrepeated) = "AssetList",
    (gogoproto.nullable)     = false
  ];
}

// Asset is an entry of the asset whitelist: an asset priced directly in USD
// (spec §21.6 stage 2), e.g. "ubtc" or "ueth". It is not a bank denom.
message Asset {
  option (gogoproto.equal)            = false;
  option (gogoproto.goproto_getters)  = false;
  option (gogoproto.goproto_stringer) = false;

  string name = 1 [(gogoproto.moretags) = "yaml:\"name\""];
}

// Denom - the object to hold configurations of each denom
message Denom {
  option (gogoproto.equal)            = false;
  option (gogoproto.goproto_getters)  = false;
  option (gogoproto.goproto_stringer) = false;

  string name      = 1 [(gogoproto.moretags) = "yaml:\"name\""];
  string tobin_tax = 2 [
    (cosmos_proto.scalar)  = "cosmos.Dec",
    (gogoproto.moretags)   = "yaml:\"tobin_tax\"",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable)   = false
  ];
}

// struct for aggregate prevoting on the ExchangeRateVote.
// The purpose of aggregate prevote is to hide vote exchange rates with hash
// which is formatted as hex string in SHA256("{salt}:{exchange rate}{denom},...,{exchange rate}{denom}:{voter}")
message AggregateExchangeRatePrevote {
  option (gogoproto.equal)            = false;
  option (gogoproto.goproto_getters)  = false;
  option (gogoproto.goproto_stringer) = false;

  string hash         = 1 [(gogoproto.moretags) = "yaml:\"hash\""];
  string voter        = 2 [(gogoproto.moretags) = "yaml:\"voter\""];
  uint64 submit_block = 3 [(gogoproto.moretags) = "yaml:\"submit_block\""];
}

// MsgAggregateExchangeRateVote - struct for voting on
// the exchange rates of Luna denominated in various Terra assets.
message AggregateExchangeRateVote {
  option (gogoproto.equal)            = false;
  option (gogoproto.goproto_getters)  = false;
  option (gogoproto.goproto_stringer) = false;

  repeated ExchangeRateTuple exchange_rate_tuples = 1 [
    (gogoproto.moretags)     = "yaml:\"exchange_rate_tuples\"",
    (gogoproto.castrepeated) = "ExchangeRateTuples",
    (gogoproto.nullable)     = false
  ];

  string voter = 2 [(gogoproto.moretags) = "yaml:\"voter\""];
}

// ExchangeRateTuple - struct to store interpreted exchange rates data to store
message ExchangeRateTuple {
  option (gogoproto.equal)            = false;
  option (gogoproto.goproto_getters)  = false;
  option (gogoproto.goproto_stringer) = false;

  string denom         = 1 [(gogoproto.moretags) = "yaml:\"denom\""];
  string exchange_rate = 2 [
    (cosmos_proto.scalar)  = "cosmos.Dec",
    (gogoproto.moretags)   = "yaml:\"exchange_rate\"",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable)   = false
  ];
  // depth is the aggregated order-book depth at ±2% reported by the feeder
  // for an asset, in USD micro units (spec §21.3 Depth2%). Zero when not
  // reported; ignored for denoms of the LUNC-centric whitelist.
  string depth = 3 [
    (cosmos_proto.scalar)  = "cosmos.Int",
    (gogoproto.moretags)   = "yaml:\"depth\"",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable)   = false
  ];
}

// RateSample is the consensus exchange rate of a denom at the end of one vote
// period together with the dispersion of the ballot that produced it
// (Liquidity Fabric spec §21.1: dispersion = (P75 - P25) / median, weighted by
// voting power). Samples feed the Dispersion and Twap queries (§21.6 stage 1).
message RateSample {
  option (gogoproto.equal)           = false;
  option (gogoproto.goproto_getters) = false;

  string denom         = 1 [(gogoproto.moretags) = "yaml:\"denom\""];
  string exchange_rate = 2 [
    (cosmos_proto.scalar)  = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable)   = false
  ];
  string dispersion = 3 [
    (cosmos_proto.scalar)  = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable)   = false
  ];
  // vote_period is the vote period index (height / vote_period).
  uint64 vote_period = 4;
  int64  height      = 5;
  google.protobuf.Timestamp time = 6 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
  // depth is the voting-power weighted median of the Depth2% reported for an
  // asset (USD micro units); zero for denoms and when no feeder reported it.
  string depth = 7 [
    (cosmos_proto.scalar)  = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable)   = false
  ];
}
