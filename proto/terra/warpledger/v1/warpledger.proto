syntax = "proto3";
package terra.warpledger.v1;

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "amino/amino.proto";

option go_package = "github.com/classic-terra/core/v4/x/warpledger/types";

// Params defines the x/warpledger parameters.
message Params {
  option (amino.name)      = "terra/warpledger/Params";
  option (gogoproto.equal) = true;

  // default_domain_cap is the net exposure cap applied to a (token, domain)
  // pair that has no explicit cap set by governance. Zero blocks outbound
  // transfers on such pairs until MsgSetDomainCap is executed.
  string default_domain_cap = 1 [
    (cosmos_proto.scalar)  = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable)   = false,
    (amino.dont_omitempty) = true
  ];
  // bonded_cap_threshold is the per-domain cap above which the token's ISM
  // must be bonded in x/ismbond (spec §7.2, §6.6). Zero disables the check.
  string bonded_cap_threshold = 2 [
    (cosmos_proto.scalar)  = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable)   = false
  ];
  // settle_source_cap is the default share of a basket token's circulation
  // that one origin domain may back (spec §11.4 D-29 item 4, initial 40%).
  // An origin whose share would exceed it refuses new deposits.
  string settle_source_cap = 3 [
    (cosmos_proto.scalar)  = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable)   = false
  ];
}

// DomainLedger is the per (warp token, remote domain) accounting record kept
// in consensus. Net exposure is `sent - received` (spec §9.1).
message DomainLedger {
  // token_id is the hyperlane id of the warp token (32-byte hex address).
  string token_id = 1 [
    (gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress",
    (gogoproto.nullable)   = false
  ];
  // domain is the remote hyperlane domain id.
  uint32 domain = 2;
  // sent is the cumulative amount dispatched from Terra Classic to the domain.
  string sent = 3 [
    (cosmos_proto.scalar)  = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable)   = false
  ];
  // received is the cumulative amount processed on Terra Classic from the domain.
  string received = 4 [
    (cosmos_proto.scalar)  = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable)   = false
  ];
  // cap is the maximum allowed net exposure for the pair. Only meaningful when
  // has_cap is true; otherwise Params.default_domain_cap applies.
  string cap = 5 [
    (cosmos_proto.scalar)  = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable)   = false
  ];
  // has_cap is true once governance has set an explicit cap for the pair.
  bool has_cap = 6;
  // share_cap overrides Params.settle_source_cap for this origin of a basket
  // token (spec §11.4: origins without native issuance get a smaller cap).
  // Only meaningful when has_share_cap is true.
  string share_cap = 7 [
    (cosmos_proto.scalar)  = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable)   = false
  ];
  bool has_share_cap = 8;
  // paused refuses new deposits from the origin and redemptions towards it
  // (spec §11.4 item 4: a failed or depegged origin is paused; item 6: a
  // paused origin is redeemed through the others).
  bool paused = 9;
}
