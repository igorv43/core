syntax = "proto3";
package terra.liquidstake.v1;

import "gogoproto/gogo.proto";
import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "terra/liquidstake/v1/liquidstake.proto";

option go_package = "github.com/classic-terra/core/v4/x/liquidstake/types";

// GenesisState defines the x/liquidstake module's genesis state.
message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  Epoch epoch = 2 [(gogoproto.nullable) = false];
  repeated UnstakeRequest unstake_requests = 3 [(gogoproto.nullable) = false];
  uint64 next_request_id = 4;
  // owed is the total uluna owed to undelegated requests not yet claimed.
  string owed = 5 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  repeated ValidatorState validators = 6 [(gogoproto.nullable) = false];
}
