syntax = "proto3";
package terra.liquidstake.v1;

option go_package = "github.com/classic-terra/core/v4/x/liquidstake/types";

message EventStaked {
  string address = 1;
  string amount = 2;
  string minted = 3;
  string exchange_rate = 4;
}

message EventUnstaked {
  string address = 1;
  string st_amount = 2;
  string amount = 3;
  string exchange_rate = 4;
  bool instant = 5;
  uint64 request_id = 6;
}

message EventClaimed {
  string address = 1;
  string amount = 2;
  repeated uint64 request_ids = 3;
}

message EventEpochProcessed {
  uint64 epoch = 1;
  int64 height = 2;
  string rewards = 3;
  string fee = 4;
  string burned = 5;
  string delegated = 6;
  string undelegated = 7;
  string redelegated = 8;
  uint32 eligible_validators = 9;
  string exchange_rate = 10;
}

message EventValidatorRemoved {
  string operator_address = 1;
  string reason = 2;
}

// EventSlashAbsorbed is emitted from the staking BeforeValidatorSlashed hook
// when a validator holding module delegations is slashed: validator is the
// operator address, fraction the slash fraction, loss the uluna the module's
// delegation loses (truncated estimate from the shares) and the exchange
// rates are the one before the slash and the one expected after it. The
// epoch fee never emits it.
message EventSlashAbsorbed {
  uint64 epoch = 1;
  string exchange_rate_before = 2;
  string exchange_rate_after = 3;
  string validator = 4;
  string fraction = 5;
  string loss = 6;
}

// EventInvariantBroken is emitted at the end of an epoch when a module
// invariant of spec §24.9 does not hold (spec §25.1 item 6). invariant is
// the number of the broken invariant (1 solvency/rate identity, 2 queue
// conservation, 3 module cap) and detail describes it. The chain is never
// halted.
message EventInvariantBroken {
  uint64 epoch = 1;
  int64 height = 2;
  uint32 invariant = 3;
  string detail = 4;
}
