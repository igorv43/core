syntax = "proto3";
package terra.liquidstake.v1;

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/base/v1beta1/coin.proto";
import "terra/liquidstake/v1/liquidstake.proto";

option go_package = "github.com/classic-terra/core/v4/x/liquidstake/types";

// Msg defines the x/liquidstake Msg service (spec Annex E.4).
service Msg {
  option (cosmos.msg.v1.service) = true;

  // Stake locks uluna and mints stLUNC at the current exchange rate.
  rpc Stake(MsgStake) returns (MsgStakeResponse);
  // Unstake burns stLUNC at the current exchange rate; the uluna is paid from
  // the buffer immediately when possible, otherwise after the unbonding cycle.
  rpc Unstake(MsgUnstake) returns (MsgUnstakeResponse);
  // Claim pays every matured unstake request of the sender.
  rpc Claim(MsgClaim) returns (MsgClaimResponse);
  // UpdateParams updates the module parameters (governance only).
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

message MsgStake {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name)           = "terra/liquidstake/MsgStake";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin amount = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message MsgStakeResponse {
  cosmos.base.v1beta1.Coin minted = 1 [(gogoproto.nullable) = false];
  string exchange_rate = 2 [(cosmos_proto.scalar) = "cosmos.Dec", (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec", (gogoproto.nullable) = false];
}

message MsgUnstake {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name)           = "terra/liquidstake/MsgUnstake";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin amount = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message MsgUnstakeResponse {
  // amount is the uluna redeemed (paid now when instant is true, otherwise owed).
  cosmos.base.v1beta1.Coin amount = 1 [(gogoproto.nullable) = false];
  bool instant = 2;
  // request_id is set when the redemption was queued.
  uint64 request_id = 3;
  string exchange_rate = 4 [(cosmos_proto.scalar) = "cosmos.Dec", (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec", (gogoproto.nullable) = false];
}

message MsgClaim {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name)           = "terra/liquidstake/MsgClaim";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgClaimResponse {
  cosmos.base.v1beta1.Coin amount = 1 [(gogoproto.nullable) = false];
  repeated uint64 request_ids = 2;
}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name)           = "terra/liquidstake/MsgUpdateParams";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message MsgUpdateParamsResponse {}
