syntax = "proto3";
package terra.ismbond.v1;

import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "terra/ismbond/v1/ismbond.proto";

option go_package = "github.com/classic-terra/core/v4/x/ismbond/types";

// Query defines the x/ismbond Query service.
service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/terra/ismbond/v1/params";
  }
  rpc Operator(QueryOperatorRequest) returns (QueryOperatorResponse) {
    option (google.api.http).get = "/terra/ismbond/v1/operators/{address}";
  }
  rpc Operators(QueryOperatorsRequest) returns (QueryOperatorsResponse) {
    option (google.api.http).get = "/terra/ismbond/v1/operators";
  }
  // IsmBonded reports whether at least the threshold of a multisig ISM's validators has an active bond.
  rpc IsmBonded(QueryIsmBondedRequest) returns (QueryIsmBondedResponse) {
    option (google.api.http).get = "/terra/ismbond/v1/isms/{ism_id}/bonded";
  }
  rpc Root(QueryRootRequest) returns (QueryRootResponse) {
    option (google.api.http).get = "/terra/ismbond/v1/roots/{mailbox_id}/{index}";
  }
  rpc Roots(QueryRootsRequest) returns (QueryRootsResponse) {
    option (google.api.http).get = "/terra/ismbond/v1/roots/{mailbox_id}";
  }
}

message QueryParamsRequest {}
message QueryParamsResponse {
  Params params = 1 [(gogoproto.nullable) = false];
}

message QueryOperatorRequest {
  string address = 1;
}
message QueryOperatorResponse {
  Operator operator = 1 [(gogoproto.nullable) = false];
}

message QueryOperatorsRequest {}
message QueryOperatorsResponse {
  repeated Operator operators = 1 [(gogoproto.nullable) = false];
}

message QueryIsmBondedRequest {
  string ism_id = 1;
}
message QueryIsmBondedResponse {
  bool bonded = 1;
  uint32 threshold = 2;
  repeated string validators = 3;
  repeated string bonded_validators = 4;
}

message QueryRootRequest {
  string mailbox_id = 1;
  uint32 index = 2;
}
message QueryRootResponse {
  RootRecord record = 1 [(gogoproto.nullable) = false];
}

message QueryRootsRequest {
  string mailbox_id = 1;
  uint32 limit = 2;
}
message QueryRootsResponse {
  repeated RootRecord records = 1 [(gogoproto.nullable) = false];
}
