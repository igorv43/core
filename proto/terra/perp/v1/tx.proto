syntax = "proto3";
package terra.perp.v1;

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/base/v1beta1/coin.proto";
import "terra/batch/v1/batch.proto";
import "terra/perp/v1/perp.proto";

option go_package = "github.com/classic-terra/core/v4/x/perp/types";

// Msg defines the x/perp Msg service (spec Annex E.3).
service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc DepositCollateral(MsgDepositCollateral) returns (MsgDepositCollateralResponse);
  rpc WithdrawCollateral(MsgWithdrawCollateral) returns (MsgWithdrawCollateralResponse);
  // SubmitPerpIntent submits a margin-reserved order to the x/batch auction (spec §14.3).
  rpc SubmitPerpIntent(MsgSubmitPerpIntent) returns (MsgSubmitPerpIntentResponse);
  // SubmitTriggerOrder registers a resident reduce-only stop / take-profit (spec §14.5).
  rpc SubmitTriggerOrder(MsgSubmitTriggerOrder) returns (MsgSubmitTriggerOrderResponse);
  rpc CancelTriggerOrder(MsgCancelTriggerOrder) returns (MsgCancelTriggerOrderResponse);
  // SetAutoTopUp opts in or out of the automatic margin top-up (spec §14.5).
  rpc SetAutoTopUp(MsgSetAutoTopUp) returns (MsgSetAutoTopUpResponse);
  // FundInsurance donates settlement to the insurance fund (permissionless; it can never be withdrawn, §26.3).
  rpc FundInsurance(MsgFundInsurance) returns (MsgFundInsuranceResponse);
  // SetFeeInLuna opts in or out of paying protocol fees in LUNC at a discount (spec §23.3).
  rpc SetFeeInLuna(MsgSetFeeInLuna) returns (MsgSetFeeInLunaResponse);
  // governance
  rpc CreateMarket(MsgCreateMarket) returns (MsgCreateMarketResponse);
  rpc UpdateMarket(MsgUpdateMarket) returns (MsgUpdateMarketResponse);
  // EnableMarket fails when the listing criteria of spec §21.3 do not hold.
  rpc EnableMarket(MsgEnableMarket) returns (MsgEnableMarketResponse);
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

message MsgDepositCollateral {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name)           = "terra/perp/MsgDepositCollateral";
  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin amount = 2 [(gogoproto.nullable) = false];
}
message MsgDepositCollateralResponse {}

message MsgWithdrawCollateral {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name)           = "terra/perp/MsgWithdrawCollateral";
  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin amount = 2 [(gogoproto.nullable) = false];
}
message MsgWithdrawCollateralResponse {}

message MsgSubmitPerpIntent {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name)           = "terra/perp/MsgSubmitPerpIntent";
  string sender    = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string market_id = 2;
  terra.batch.v1.Side side = 3;
  string qty = 4 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  string limit_price = 5 [(cosmos_proto.scalar) = "cosmos.Dec", (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec", (gogoproto.nullable) = false];
  int64  expiry_height = 6;
  bool   reduce_only   = 7;
  string frontend      = 8 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgSubmitPerpIntentResponse {
  uint64 intent_id = 1;
  uint64 batch_id  = 2;
}

message MsgSubmitTriggerOrder {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name)           = "terra/perp/MsgSubmitTriggerOrder";
  string sender    = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string market_id = 2;
  string trigger_price = 3 [(cosmos_proto.scalar) = "cosmos.Dec", (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec", (gogoproto.nullable) = false];
  bool   fire_above = 4;
  // qty closes part of the position; zero closes it entirely.
  string qty = 5 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  // slippage of the injected limit; zero uses the default parameter.
  string slippage = 6 [(cosmos_proto.scalar) = "cosmos.Dec", (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec", (gogoproto.nullable) = false];
}
message MsgSubmitTriggerOrderResponse {
  uint64 trigger_id = 1;
}

message MsgCancelTriggerOrder {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name)           = "terra/perp/MsgCancelTriggerOrder";
  string sender     = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 trigger_id = 2;
}
message MsgCancelTriggerOrderResponse {}

message MsgSetAutoTopUp {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name)           = "terra/perp/MsgSetAutoTopUp";
  string sender  = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bool   enabled = 2;
}
message MsgSetAutoTopUpResponse {}

message MsgFundInsurance {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name)           = "terra/perp/MsgFundInsurance";
  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin amount = 2 [(gogoproto.nullable) = false];
}
message MsgFundInsuranceResponse {}

message MsgSetFeeInLuna {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name)           = "terra/perp/MsgSetFeeInLuna";
  string sender  = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bool   enabled = 2;
}
message MsgSetFeeInLunaResponse {}

message MsgCreateMarket {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name)           = "terra/perp/MsgCreateMarket";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // id is "<base>-perp/<settlement>"; the x/batch market is created disabled with the same id.
  string id           = 2;
  string oracle_asset = 3;
  string max_leverage = 4 [(cosmos_proto.scalar) = "cosmos.Dec", (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec", (gogoproto.nullable) = false];
  string oi_cap = 5 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  string alpha = 6 [(cosmos_proto.scalar) = "cosmos.Dec", (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec", (gogoproto.nullable) = false];
  string stress = 7 [(cosmos_proto.scalar) = "cosmos.Dec", (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec", (gogoproto.nullable) = false];
  int64  listing_min_blocks = 8;
  bool   venues_attested    = 9;
  string min_qty = 10 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  string tick_size = 11 [(cosmos_proto.scalar) = "cosmos.Dec", (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec", (gogoproto.nullable) = false];
  bool   st_collateral_allowed = 12;
}
message MsgCreateMarketResponse {}

message MsgUpdateMarket {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name)           = "terra/perp/MsgUpdateMarket";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string market_id = 2;
  string max_leverage = 3 [(cosmos_proto.scalar) = "cosmos.Dec", (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec", (gogoproto.nullable) = false];
  string oi_cap = 4 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  string alpha = 5 [(cosmos_proto.scalar) = "cosmos.Dec", (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec", (gogoproto.nullable) = false];
  string stress = 6 [(cosmos_proto.scalar) = "cosmos.Dec", (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec", (gogoproto.nullable) = false];
  int64  listing_min_blocks = 7;
  bool   venues_attested    = 8;
  bool   st_collateral_allowed = 9;
}
message MsgUpdateMarketResponse {}

message MsgEnableMarket {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name)           = "terra/perp/MsgEnableMarket";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string market_id = 2;
  bool   enabled   = 3;
}
message MsgEnableMarketResponse {}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name)           = "terra/perp/MsgUpdateParams";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false];
}
message MsgUpdateParamsResponse {}
