syntax = "proto3";
package terra.batch.v1;

import "gogoproto/gogo.proto";
import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/base/v1beta1/coin.proto";
import "terra/batch/v1/batch.proto";

option go_package = "github.com/classic-terra/core/v4/x/batch/types";

// SolverEscrowEntry is a solver escrow balance for genesis export.
message SolverEscrowEntry {
  string solver = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin balance = 2 [(gogoproto.nullable) = false];
}

// GenesisState defines the x/batch module's genesis state.
message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  repeated Market markets = 2 [(gogoproto.nullable) = false];
  repeated Intent intents = 3 [(gogoproto.nullable) = false];
  uint64 next_intent_id = 4;
  repeated Solver solvers = 5 [(gogoproto.nullable) = false];
  repeated SolverEscrowEntry solver_escrows = 6 [(gogoproto.nullable) = false];
  repeated Frontend frontends = 7 [(gogoproto.nullable) = false];
  repeated FrontendApproval frontend_approvals = 8 [(gogoproto.nullable) = false];
}
