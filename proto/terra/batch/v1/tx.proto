syntax = "proto3";
package terra.batch.v1;

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/base/v1beta1/coin.proto";
import "terra/batch/v1/batch.proto";

option go_package = "github.com/classic-terra/core/v4/x/batch/types";

// Msg defines the x/batch Msg service (spec Annex E.2).
service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc SubmitIntent(MsgSubmitIntent) returns (MsgSubmitIntentResponse);
  rpc CancelIntent(MsgCancelIntent) returns (MsgCancelIntentResponse);
  rpc RegisterSolver(MsgRegisterSolver) returns (MsgRegisterSolverResponse);
  rpc UnbondSolver(MsgUnbondSolver) returns (MsgUnbondSolverResponse);
  rpc DepositSolverEscrow(MsgDepositSolverEscrow) returns (MsgDepositSolverEscrowResponse);
  rpc WithdrawSolverEscrow(MsgWithdrawSolverEscrow) returns (MsgWithdrawSolverEscrowResponse);
  rpc CommitBid(MsgCommitBid) returns (MsgCommitBidResponse);
  rpc RevealBid(MsgRevealBid) returns (MsgRevealBidResponse);
  rpc RegisterFrontend(MsgRegisterFrontend) returns (MsgRegisterFrontendResponse);
  rpc ApproveFrontend(MsgApproveFrontend) returns (MsgApproveFrontendResponse);
  rpc RevokeFrontend(MsgRevokeFrontend) returns (MsgRevokeFrontendResponse);
  // governance
  rpc CreateMarket(MsgCreateMarket) returns (MsgCreateMarketResponse);
  rpc SetMarketEnabled(MsgSetMarketEnabled) returns (MsgSetMarketEnabledResponse);
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

message MsgSubmitIntent {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name)           = "terra/batch/MsgSubmitIntent";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string market_id = 2;
  Side side = 3;
  cosmos.base.v1beta1.Coin amount_in = 4 [(gogoproto.nullable) = false];
  string limit_price = 5 [(cosmos_proto.scalar) = "cosmos.Dec", (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec", (gogoproto.nullable) = false];
  string min_out = 6 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  int64 expiry_height = 7;
  string frontend = 8 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgSubmitIntentResponse {
  uint64 intent_id = 1;
  uint64 batch_id = 2;
}

message MsgCancelIntent {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name)           = "terra/batch/MsgCancelIntent";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 intent_id = 2;
}
message MsgCancelIntentResponse {}

message MsgRegisterSolver {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name)           = "terra/batch/MsgRegisterSolver";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin bond = 2 [(gogoproto.nullable) = false];
}
message MsgRegisterSolverResponse {}

message MsgUnbondSolver {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name)           = "terra/batch/MsgUnbondSolver";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgUnbondSolverResponse {
  int64 refund_height = 1;
}

message MsgDepositSolverEscrow {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name)           = "terra/batch/MsgDepositSolverEscrow";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin amount = 2 [(gogoproto.nullable) = false];
}
message MsgDepositSolverEscrowResponse {}

message MsgWithdrawSolverEscrow {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name)           = "terra/batch/MsgWithdrawSolverEscrow";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin amount = 2 [(gogoproto.nullable) = false];
}
message MsgWithdrawSolverEscrowResponse {}

message MsgCommitBid {
  option (cosmos.msg.v1.signer) = "solver";
  option (amino.name)           = "terra/batch/MsgCommitBid";

  string solver = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 batch_id = 2;
  string market_id = 3;
  // commitment = SHA256(bid_bytes || salt || solver || batch_id) (spec §15.1)
  bytes commitment = 4;
}
message MsgCommitBidResponse {}

message MsgRevealBid {
  option (cosmos.msg.v1.signer) = "solver";
  option (amino.name)           = "terra/batch/MsgRevealBid";

  string solver = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 batch_id = 2;
  Bid bid = 3 [(gogoproto.nullable) = false];
  bytes salt = 4;
}
message MsgRevealBidResponse {}

message MsgRegisterFrontend {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name)           = "terra/batch/MsgRegisterFrontend";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint32 fee_bps = 2;
}
message MsgRegisterFrontendResponse {}

message MsgApproveFrontend {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name)           = "terra/batch/MsgApproveFrontend";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string frontend = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint32 max_fee_bps = 3;
}
message MsgApproveFrontendResponse {}

message MsgRevokeFrontend {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name)           = "terra/batch/MsgRevokeFrontend";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string frontend = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgRevokeFrontendResponse {}

message MsgCreateMarket {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name)           = "terra/batch/MsgCreateMarket";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Market market = 2 [(gogoproto.nullable) = false];
}
message MsgCreateMarketResponse {}

message MsgSetMarketEnabled {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name)           = "terra/batch/MsgSetMarketEnabled";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string market_id = 2;
  bool enabled = 3;
}
message MsgSetMarketEnabledResponse {}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name)           = "terra/batch/MsgUpdateParams";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}
message MsgUpdateParamsResponse {}
