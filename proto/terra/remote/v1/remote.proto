syntax = "proto3";
package terra.remote.v1;

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "amino/amino.proto";
import "cosmos/base/v1beta1/coin.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/classic-terra/core/v4/x/remote/types";

// Params defines the x/remote parameters (spec §14.4, Annex B).
message Params {
  option (amino.name)      = "terra/remote/Params";
  option (gogoproto.equal) = true;

  // session_ttl_seconds is the default lifetime of a session key (param_remote_session_ttl, 30 days).
  int64 session_ttl_seconds = 1;
  // max_sessions bounds the simultaneous session keys of a remote account (param_remote_max_sessions).
  uint32 max_sessions = 2;
  // msg_fee is the anti-spam fee per message of a remote payload, charged to the remote account.
  cosmos.base.v1beta1.Coin msg_fee = 3 [(gogoproto.nullable) = false];
  // max_msgs_per_payload bounds the messages of one payload (absolute maximum 10 in code, spec §12).
  uint32 max_msgs_per_payload = 4;
  // paymaster_daily_cap is the fee allowance granted to each session key per period.
  cosmos.base.v1beta1.Coin paymaster_daily_cap = 5 [(gogoproto.nullable) = false];
  // paymaster_min_collateral is the free collateral (settlement units) a remote account needs for its
  // session keys to receive an allowance.
  string paymaster_min_collateral = 6 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  // paymaster_period_seconds is the allowance period.
  int64 paymaster_period_seconds = 7;
  // withdraw_fee_cap is the interchain gas the paymaster covers for one withdrawal.
  cosmos.base.v1beta1.Coin withdraw_fee_cap = 8 [(gogoproto.nullable) = false];
  // beacon_fee_cap is the interchain gas the paymaster covers for one beacon message (spec §14.6 item 3).
  cosmos.base.v1beta1.Coin beacon_fee_cap = 9 [(gogoproto.nullable) = false];
  // max_beacons_per_block bounds the beacon dispatches of one EndBlock.
  uint32 max_beacons_per_block = 10;
}

// BeaconKind is the fact a beacon transmits (spec §14.6 item 3): only chain
// state, signed by the normal message path, never an opinion.
enum BeaconKind {
  option (gogoproto.goproto_enum_prefix) = false;
  BEACON_KIND_UNSPECIFIED = 0;
  // EXCHANGE_RATE: the stLUNC exchange rate of x/liquidstake.
  BEACON_KIND_EXCHANGE_RATE = 1;
  // ROUTE_SOLVENCY: the ledger of a warp token on a domain (sent, received, cap, collateral).
  BEACON_KIND_ROUTE_SOLVENCY = 2;
  // POSITION_DIGEST: a digest of an account's perp positions and collateral.
  BEACON_KIND_POSITION_DIGEST = 3;
}

// Beacon is a periodic state message to a remote contract (spec §14.6 item 3).
message Beacon {
  uint64 id = 1;
  string app_id = 2 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  uint32 domain = 3;
  string recipient = 4 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  BeaconKind kind = 5;
  // interval_blocks is the dispatch period.
  int64 interval_blocks = 6;
  int64 last_height = 7;
  // token_id selects the warp token of a ROUTE_SOLVENCY beacon.
  string token_id = 8 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  // account selects the account of a POSITION_DIGEST beacon.
  string account = 9;
}

// RemoteApp is the Hyperlane application instance (router id 3) that
// receives control messages for a mailbox.
message RemoteApp {
  string id = 1 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  string mailbox_id = 2 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  // ism_id overrides the mailbox default ISM when set.
  string ism_id = 3 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = true];
  string owner = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// Gateway is a trusted periphery contract of an origin domain (spec §14.4
// item 5, §14.6): only its messages may name an on_behalf_of controller.
message Gateway {
  string app_id = 1 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  uint32 domain = 2;
  string address = 3 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  // exit_factory is the CREATE2 factory of the withdrawal exit contracts on
  // the domain (spec §14.7.2, D-30): 32-byte hex, zero when native-currency
  // withdrawals are not offered on the domain.
  string exit_factory = 4 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  // exit_init_code_hash is the keccak256 of the exit clone init code, constant
  // per factory (32 bytes).
  bytes exit_init_code_hash = 5;
}

// RemoteAccount is a derived account controlled by (domain, controller).
message RemoteAccount {
  uint32 domain = 1;
  string controller = 2 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  string address = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  int64 created_height = 4;
  uint64 payloads = 5;
}

// Session is a session key of a remote account (authz grants scoped to the
// trading messages, spec §14.4 item 3).
message Session {
  string account = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string session_key = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  google.protobuf.Timestamp expiry = 3 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
  int64 granted_height = 4;
  // paymaster reports whether a fee allowance was granted to the key.
  bool paymaster = 5;
}

// Withdrawal records a warp transfer sent back to the controller.
message Withdrawal {
  string account = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 seq = 2;
  string message_id = 3 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  string token_id = 4 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  string amount = 5 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  int64 height = 6;
}

// RemotePayload is the body of a control message (spec Annex E.5). The
// origin domain and sender come from the mailbox, never from the payload.
message RemotePayload {
  // on_behalf_of is the controller a trusted gateway acts for (32 bytes); empty for direct senders.
  bytes on_behalf_of = 1;
  // msgs are messages of the whitelist in code, signed by the derived account.
  repeated google.protobuf.Any msgs = 2;
  // conversion carries the data of a native-currency deposit converted at the
  // edge by the enrolled gateway (spec §14.7); recorded as a ConversionReceipt.
  ConversionData conversion = 3;
  // update confirms the result of a native-currency withdrawal executed on
  // the origin (spec §14.7.3 item 6); only from the enrolled gateway.
  ConversionUpdate update = 4;
}

// ConversionData is measured by the gateway contract on the origin chain
// (spec §14.7.3 item 2); amounts are 32-byte big-endian unsigned integers.
message ConversionData {
  // token_in is the input asset on the origin: 0x-prefixed address or "native".
  string token_in = 1;
  uint32 decimals_in = 2;
  bytes amount_in = 3;
  // usdc_amount is the settlement asset actually received, by balance difference.
  bytes usdc_amount = 4;
  bytes dex_fee = 5;
  bytes route_fee = 6;
  // min_accepted is the minimum the user set before signing.
  bytes min_accepted = 7;
  uint64 origin_block = 8;
}

// ConversionUpdate reports the outcome of a withdrawal exit on the origin.
message ConversionUpdate {
  // withdraw_message_id is the hyperlane message id of the warp transfer (32 bytes).
  bytes withdraw_message_id = 1;
  // amount_out is what the user received, in token_out units (32-byte big-endian).
  bytes amount_out = 2;
  // fallback_to_usdc is true when the swap failed and USDC was paid instead.
  bool fallback_to_usdc = 3;
  uint64 origin_block = 4;
}

// ConversionReceipt is the on-chain record of a conversion at the edge
// (spec §14.7.4), one per deposit and one per withdrawal, keyed by
// (account, message id). It is evidence, never a balance.
message ConversionReceipt {
  string account = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint32 origin_domain = 2;
  uint64 origin_block = 3;
  string message_id = 4 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  ConversionDirection direction = 5;
  // token_in is the asset converted on deposit; on withdrawal it is the
  // settlement asset released.
  string token_in = 6;
  string amount_in = 7;
  string usdc_amount = 8;
  // effective_rate is usdc per unit of token_in, both in display units.
  string effective_rate = 9 [(cosmos_proto.scalar) = "cosmos.Dec", (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec", (gogoproto.nullable) = false];
  string dex_fee = 10;
  string route_fee = 11;
  string min_accepted = 12;
  bool fallback_to_usdc = 13;
  int64 registered_height = 14;
  // token_out is the asset requested on withdrawal (32-byte hex on the origin).
  string token_out = 15;
  // amount_out is what the user received on withdrawal, once confirmed.
  string amount_out = 16;
  // confirmed is true once the origin reported the outcome of a withdrawal.
  bool confirmed = 17;
  // exit_address is the deterministic exit contract the withdrawal was sent to.
  string exit_address = 18 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
}

enum ConversionDirection {
  option (gogoproto.goproto_enum_prefix) = false;
  CONVERSION_DEPOSIT = 0;
  CONVERSION_WITHDRAW = 1;
}
