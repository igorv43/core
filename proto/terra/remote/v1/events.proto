syntax = "proto3";
package terra.remote.v1;

option go_package = "github.com/classic-terra/core/v4/x/remote/types";

message EventRemoteExecuted {
  string account    = 1;
  uint32 domain     = 2;
  string controller = 3;
  uint32 msgs       = 4;
}
message EventRemoteRejected {
  string account    = 1;
  uint32 domain     = 2;
  string controller = 3;
  string reason     = 4;
}
message EventSessionGranted {
  string account       = 1;
  string session_key   = 2;
  string expiry        = 3;
  bool   paymaster     = 4;
}
message EventSessionRevoked {
  string account     = 1;
  string session_key = 2;
}
message EventRemoteWithdraw {
  string account    = 1;
  string token_id   = 2;
  string amount     = 3;
  uint32 domain     = 4;
  string recipient  = 5;
  string message_id = 6;
}
message EventBeaconSent {
  uint64 beacon_id  = 1;
  uint32 domain     = 2;
  string recipient  = 3;
  string kind       = 4;
  string message_id = 5;
}

// EventConversionReceiptCreated is emitted when a conversion receipt is recorded (spec §14.7.5).
message EventConversionReceiptCreated {
  string account = 1;
  string message_id = 2;
  string direction = 3;
  string token_in = 4;
  string amount_in = 5;
  string usdc_amount = 6;
  string effective_rate = 7;
  string token_out = 8;
  string min_accepted = 9;
  string exit_address = 10;
}

// EventConversionReceiptUpdated is emitted when the origin confirms a withdrawal exit.
message EventConversionReceiptUpdated {
  string account = 1;
  string message_id = 2;
  string amount_out = 3;
  bool fallback_to_usdc = 4;
}

// EventControlSent is emitted when a control order is dispatched to a FabricExecutor (spec §11.5).
message EventControlSent {
  uint32 domain = 1;
  string action = 2;
  uint64 nonce = 3;
  string message_id = 4;
  // params renders the order: destination domain and amount, fees, limits or leg.
  string params = 5;
}

// EventRemotePending is emitted when a payload waits for its deposit (§4.3).
message EventRemotePending {
  string account = 1;
  uint32 domain = 2;
  string controller = 3;
  uint64 pending_id = 4;
  string token_id = 5;
  string amount = 6;
  int64 expiry_height = 7;
}

// EventRemoteSkipped is emitted when a withdrawal that references a zero
// result is skipped (§4.2); it is not an error.
message EventRemoteSkipped {
  string account = 1;
  uint32 domain = 2;
  string controller = 3;
  uint32 index = 4;
  string msg_type = 5;
  string reason = 6;
}

// EventDepositCredited is emitted when a warp deposit from an origin with an
// enrolled gateway is recorded as a deposit credit (§4.3).
message EventDepositCredited {
  string account = 1;
  string token_id = 2;
  uint32 origin = 3;
  string amount = 4;
  string credit = 5;
}

// EventRemoteStake is the receipt of a remote liquid stake (§2.1): uluna
// staked, stLUNC minted at the rate, and the withdrawal that returns it.
message EventRemoteStake {
  string account = 1;
  string controller = 2;
  uint32 domain = 3;
  string uluna = 4;
  string minted = 5;
  string rate = 6;
  string withdrawal_message_id = 7;
}

// EventRemoteUnstake is the receipt of a remote unstake (§2.2).
message EventRemoteUnstake {
  string account = 1;
  string controller = 2;
  uint32 domain = 3;
  string st_amount = 4;
  string amount = 5;
  bool instant = 6;
  uint64 request_id = 7;
  string rate = 8;
  string withdrawal_message_id = 9;
}

// EventRemoteClaim is the receipt of a remote claim of matured requests;
// auto is true when it was made by the epoch auto-return (§4.4).
message EventRemoteClaim {
  string account = 1;
  string controller = 2;
  uint32 domain = 3;
  string amount = 4;
  repeated uint64 request_ids = 5;
  string withdrawal_message_id = 6;
  bool auto = 7;
}

// EventAutoReturnSet is emitted when an account opts in or out of the auto-return.
message EventAutoReturnSet {
  string account = 1;
  bool enabled = 2;
  string token_id = 3;
}
