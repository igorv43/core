syntax = "proto3";
package terra.remote.v1;

import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos/base/v1beta1/coin.proto";
import "terra/remote/v1/remote.proto";

option go_package = "github.com/classic-terra/core/v4/x/remote/types";

// Query defines the x/remote Query service (spec Annex E.5).
service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/terra/remote/v1/params";
  }
  rpc RemoteApps(QueryRemoteAppsRequest) returns (QueryRemoteAppsResponse) {
    option (google.api.http).get = "/terra/remote/v1/apps";
  }
  // DeriveAddress returns the derived account of (domain, controller).
  rpc DeriveAddress(QueryDeriveAddressRequest) returns (QueryDeriveAddressResponse) {
    option (google.api.http).get = "/terra/remote/v1/derive/{domain}/{controller}";
  }
  // RemoteAccount returns the account, its bank balances and active session keys.
  rpc RemoteAccount(QueryRemoteAccountRequest) returns (QueryRemoteAccountResponse) {
    option (google.api.http).get = "/terra/remote/v1/accounts/{domain}/{controller}";
  }
  rpc Sessions(QuerySessionsRequest) returns (QuerySessionsResponse) {
    option (google.api.http).get = "/terra/remote/v1/sessions/{address}";
  }
  rpc Withdrawals(QueryWithdrawalsRequest) returns (QueryWithdrawalsResponse) {
    option (google.api.http).get = "/terra/remote/v1/withdrawals/{address}";
  }
  // ConversionReceipts lists the conversion receipts of an account, newest first (spec §14.7.5).
  rpc ConversionReceipts(QueryConversionReceiptsRequest) returns (QueryConversionReceiptsResponse) {
    option (google.api.http).get = "/terra/remote/v1/receipts/{address}";
  }
  // Executors lists the FabricExecutors and their expected collateral (spec §11.5).
  rpc Executors(QueryExecutorsRequest) returns (QueryExecutorsResponse) {
    option (google.api.http).get = "/terra/remote/v1/executors";
  }
  // Ports lists the port-of-entry chains (spec §11.6).
  rpc Ports(QueryPortsRequest) returns (QueryPortsResponse) {
    option (google.api.http).get = "/terra/remote/v1/ports";
  }
  rpc Paymaster(QueryPaymasterRequest) returns (QueryPaymasterResponse) {
    option (google.api.http).get = "/terra/remote/v1/paymaster";
  }
  rpc Beacons(QueryBeaconsRequest) returns (QueryBeaconsResponse) {
    option (google.api.http).get = "/terra/remote/v1/beacons";
  }
  // BeaconBody returns the bytes a beacon would send now (for integrators to decode).
  rpc BeaconBody(QueryBeaconBodyRequest) returns (QueryBeaconBodyResponse) {
    option (google.api.http).get = "/terra/remote/v1/beacons/{id}/body";
  }
}

message QueryParamsRequest {}
message QueryParamsResponse {
  Params params = 1 [(gogoproto.nullable) = false];
}

message QueryRemoteAppsRequest {}
message QueryRemoteAppsResponse {
  repeated RemoteApp apps = 1 [(gogoproto.nullable) = false];
  repeated Gateway gateways = 2 [(gogoproto.nullable) = false];
}

message QueryDeriveAddressRequest {
  uint32 domain = 1;
  // controller is the origin address as a 32-byte hex string.
  string controller = 2;
}
message QueryDeriveAddressResponse {
  string address = 1;
}

message QueryRemoteAccountRequest {
  uint32 domain = 1;
  string controller = 2;
}
message QueryRemoteAccountResponse {
  RemoteAccount account = 1 [(gogoproto.nullable) = false];
  repeated cosmos.base.v1beta1.Coin balances = 2 [(gogoproto.nullable) = false, (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"];
  repeated Session sessions = 3 [(gogoproto.nullable) = false];
}

message QuerySessionsRequest {
  string address = 1;
}
message QuerySessionsResponse {
  repeated Session sessions = 1 [(gogoproto.nullable) = false];
}

message QueryWithdrawalsRequest {
  string address = 1;
}
message QueryWithdrawalsResponse {
  repeated Withdrawal withdrawals = 1 [(gogoproto.nullable) = false];
}

message QueryConversionReceiptsRequest {
  string address = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryConversionReceiptsResponse {
  repeated ConversionReceipt receipts = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryExecutorsRequest {}
message ExecutorView {
  Executor executor = 1 [(gogoproto.nullable) = false];
  // ledger_collateral is max(0, received - sent) of the vault's origin in x/warpledger.
  string ledger_collateral = 2 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  // expected_collateral = ledger_collateral + net_rebalanced.
  string expected_collateral = 3 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
}
message QueryExecutorsResponse {
  repeated ExecutorView executors = 1 [(gogoproto.nullable) = false];
  int64 next_epoch_height = 2;
}
message QueryPortsRequest {}
message QueryPortsResponse {
  repeated Port ports = 1 [(gogoproto.nullable) = false];
}

message QueryPaymasterRequest {}
message QueryPaymasterResponse {
  string address = 1;
  repeated cosmos.base.v1beta1.Coin balance = 2 [(gogoproto.nullable) = false, (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"];
}

message QueryBeaconsRequest {}
message QueryBeaconsResponse {
  repeated Beacon beacons = 1 [(gogoproto.nullable) = false];
}

message QueryBeaconBodyRequest {
  uint64 id = 1;
}
message QueryBeaconBodyResponse {
  bytes body = 1;
}
