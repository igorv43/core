syntax = "proto3";
package terra.remote.v1;

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/base/v1beta1/coin.proto";
import "terra/remote/v1/remote.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/classic-terra/core/v4/x/remote/types";

// Msg defines the x/remote Msg service (spec Annex E.5). The account
// messages are signed by the derived account, i.e. they arrive inside a
// remote payload; RevokeOwnSessionKey is signed by the session key itself.
service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc GrantSessionKey(MsgGrantSessionKey) returns (MsgGrantSessionKeyResponse);
  rpc RevokeSessionKey(MsgRevokeSessionKey) returns (MsgRevokeSessionKeyResponse);
  rpc RevokeOwnSessionKey(MsgRevokeOwnSessionKey) returns (MsgRevokeOwnSessionKeyResponse);
  // Withdraw sends tokens back through warp to the controller of the account (destination locked).
  rpc Withdraw(MsgWithdraw) returns (MsgWithdrawResponse);
  rpc FundPaymaster(MsgFundPaymaster) returns (MsgFundPaymasterResponse);
  // governance
  rpc CreateRemoteApp(MsgCreateRemoteApp) returns (MsgCreateRemoteAppResponse);
  rpc SetGateway(MsgSetGateway) returns (MsgSetGatewayResponse);
  // SetBeacon creates or updates a beacon (interval_blocks = 0 removes it).
  rpc SetBeacon(MsgSetBeacon) returns (MsgSetBeaconResponse);
  // SetExecutor registers, updates or removes the FabricExecutor of a vault
  // chain and its leg limits (governance only, spec §11.5).
  rpc SetExecutor(MsgSetExecutor) returns (MsgSetExecutorResponse);
  // ExecutorControl dispatches a governance-only order (ENROLL_LEG,
  // PAUSE_LEG, UNPAUSE_LEG) to a FabricExecutor (spec §11.5.2).
  rpc ExecutorControl(MsgExecutorControl) returns (MsgExecutorControlResponse);
  // SetPort registers or removes a port-of-entry chain (governance only, spec §11.6).
  rpc SetPort(MsgSetPort) returns (MsgSetPortResponse);
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

message MsgGrantSessionKey {
  option (cosmos.msg.v1.signer) = "controller";
  option (amino.name)           = "terra/remote/MsgGrantSessionKey";
  // controller is the derived remote account.
  string controller  = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string session_key = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // ttl_seconds bounds the session lifetime; zero uses the parameter (never above it).
  int64 ttl_seconds = 3;
}
message MsgGrantSessionKeyResponse {
  google.protobuf.Timestamp expiry = 1 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
}

message MsgRevokeSessionKey {
  option (cosmos.msg.v1.signer) = "controller";
  option (amino.name)           = "terra/remote/MsgRevokeSessionKey";
  string controller  = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string session_key = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgRevokeSessionKeyResponse {}

message MsgRevokeOwnSessionKey {
  option (cosmos.msg.v1.signer) = "session_key";
  option (amino.name)           = "terra/remote/MsgRevokeOwnSessionKey";
  string session_key = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string controller  = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgRevokeOwnSessionKeyResponse {}

message MsgWithdraw {
  option (cosmos.msg.v1.signer) = "controller";
  option (amino.name)           = "terra/remote/MsgWithdraw";
  string controller = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string token_id = 2 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  string amount = 3 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  // token_out requests the conversion at the edge (spec §14.7.2): the asset
  // on the origin as 32-byte hex (address left-padded, or the native sentinel
  // 0x000000000000000000000000eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee).
  // Empty withdraws the settlement asset to the controller as before.
  string token_out = 4;
  // min_accepted is the minimum of token_out the user accepts; below it the
  // exit pays USDC instead.
  string min_accepted = 5 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = true];
}
message MsgWithdrawResponse {
  string message_id = 1 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
}

message MsgFundPaymaster {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name)           = "terra/remote/MsgFundPaymaster";
  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin amount = 2 [(gogoproto.nullable) = false];
}
message MsgFundPaymasterResponse {}

message MsgCreateRemoteApp {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name)           = "terra/remote/MsgCreateRemoteApp";
  string authority  = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string mailbox_id = 2 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  string ism_id     = 3 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = true];
}
message MsgCreateRemoteAppResponse {
  string id = 1 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
}

message MsgSetGateway {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name)           = "terra/remote/MsgSetGateway";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string app_id    = 2 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  uint32 domain    = 3;
  // address is the gateway contract; the zero address removes the gateway.
  string address = 4 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  // exit_factory and exit_init_code_hash enable native-currency withdrawals on
  // the domain (spec §14.7); zero/empty disables them.
  string exit_factory = 5 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  bytes exit_init_code_hash = 6;
}
message MsgSetGatewayResponse {}

message MsgSetBeacon {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name)           = "terra/remote/MsgSetBeacon";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // id updates an existing beacon; zero creates one.
  uint64 id = 2;
  string app_id = 3 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  uint32 domain = 4;
  string recipient = 5 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  BeaconKind kind = 6;
  int64 interval_blocks = 7;
  string token_id = 8 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  string account = 9;
}
message MsgSetBeaconResponse {
  uint64 id = 1;
}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name)           = "terra/remote/MsgUpdateParams";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false];
}
message MsgUpdateParamsResponse {}

// MsgSetExecutor is the Msg/SetExecutor request type (spec §11.5).
message MsgSetExecutor {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name)           = "terra/remote/MsgSetExecutor";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string app_id = 2 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  uint32 domain = 3;
  // address is the executor contract; the zero address removes the executor.
  string address = 4 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  string token_id = 5 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  string min_collateral = 6 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  string target_collateral = 7 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  // reset_net_rebalanced zeroes the expected-collateral adjustment after an
  // off-chain reconciliation (watcher) found the vault balance.
  bool reset_net_rebalanced = 8;
}
message MsgSetExecutorResponse {}

// MsgExecutorControl is the Msg/ExecutorControl request type (spec §11.5.2).
message MsgExecutorControl {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name)           = "terra/remote/MsgExecutorControl";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint32 domain = 2;
  ControlAction action = 3;
  // leg_domain, leg_router and leg_bridge are the ENROLL_LEG parameters.
  uint32 leg_domain = 4;
  string leg_router = 5 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  string leg_bridge = 6 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
}
message MsgExecutorControlResponse {
  string message_id = 1 [(gogoproto.customtype) = "github.com/bcp-innovations/hyperlane-cosmos/util.HexAddress", (gogoproto.nullable) = false];
  uint64 nonce = 2;
}

// MsgSetPort is the Msg/SetPort request type (spec §11.6).
message MsgSetPort {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name)           = "terra/remote/MsgSetPort";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint32 port_domain = 2;
  // vault_domain zero removes the port.
  uint32 vault_domain = 3;
  uint32 cctp_domain = 4;
}
message MsgSetPortResponse {}
